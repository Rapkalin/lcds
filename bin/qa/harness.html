<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>QA front LCDS</title>
    <style>
        html, body { margin: 0; }
        iframe { display: block; width: 100%; height: 100vh; border: 0; }
    </style>
</head>
<body>
<!--
    Le site réel est chargé dans un iframe : les assertions portent sur la page
    servie et sur son propre JavaScript. La largeur de la fenêtre du navigateur
    devient celle de l'iframe, donc les media queries répondent normalement.
-->
<iframe id="qa-target" src="/"></iframe>
<script src="front.qa.js"></script>
<script>
    window.addEventListener("load", async () => {
        const frame = document.getElementById("qa-target");

        // Sous `--virtual-time-budget`, Chrome ne produit aucune image si
        // personne n'en réclame : tout code cadencé par requestAnimationFrame
        // — le carrousel, la section parcours — paraîtrait alors inerte. Ces
        // deux pompes entretiennent la production, dans le parent comme dans
        // l'iframe : les deux sont nécessaires.
        const pompeParent = () => { requestAnimationFrame(pompeParent); };
        const pompeCible = () => { frame.contentWindow.requestAnimationFrame(pompeCible); };
        requestAnimationFrame(pompeParent);
        frame.contentWindow.requestAnimationFrame(pompeCible);

        let out;

        try {
            out = await window.runFrontQa(frame.contentWindow);
        } catch (error) {
            out = ["FAIL :: exception pendant la campagne :: " + error.message];
        }

        const block = document.createElement("pre");
        block.id = "qa-results";
        block.textContent = out.join("\n");
        document.body.appendChild(block);
    });
</script>
</body>
</html>
