# =============================================================================
# LCDS — vhost Apache du conteneur de développement.
#
# ⚠️ Les en-têtes de sécurité, la CSP, la compression et le cache des assets NE
#    SONT PAS définis ici : ils vivent dans `website/.htaccess`, qui est la
#    source unique et qui part avec le code en production (voir
#    readme/securite.md). C'est ce que `AllowOverride All` rend possible.
#    Les dupliquer ici créerait deux CSP à maintenir, qui divergeraient.
# =============================================================================
<VirtualHost *:80>
    # Le docroot est website/, pas la racine du projet : .env, composer.json,
    # config/ et tests/ restent hors de portée d'Apache.
    DocumentRoot /var/www/html/website
    DirectoryIndex index.php index.html

    <Directory /var/www/html/website>
        Options FollowSymLinks
        # Indispensable : sans ça website/.htaccess est ignoré et le site part
        # sans en-têtes de sécurité ni permaliens.
        AllowOverride All
        Require all granted
    </Directory>

    # Filet de sécurité si AllowOverride venait à être restreint : la racine du
    # projet n'est de toute façon pas servie, mais on refuse explicitement.
    <Directory /var/www/html>
        Require all denied
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
