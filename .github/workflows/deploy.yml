# Déploiement — workflow réutilisable, appelé par deploy-preprod.yml et
# deploy-prod.yml (qui ne portent que le déclencheur et le chemin distant).
#
# Modèle repris de ~/Sites/code-cookie : build d'un artefact, sauvegarde de la
# release en place, rsync, puis recréation des liens vers shared/.
#
# Arborescence cible sur le serveur :
#
#   $HOME/<remote_path>/
#   ├── shared/          ← JAMAIS écrasé : .env, plugins payants, médias, cache
#   │   ├── .env
#   │   ├── .htaccess    ← SERVI par Apache (le fichier versionné l'amorce)
#   │   ├── .htpasswd    ← optionnel : protection par mot de passe (préprod)
#   │   ├── config/      ← CHARGÉ par wp-config (le config/ versionné l'amorce)
#   │   ├── plugins/     ← plugins sous licence (ACF Pro…)
#   │   ├── uploads/
#   │   ├── uploads-webpc/
#   │   └── cache/
#   ├── config/          ← release : sert de référence à shared/config
#   ├── website/         ← release (docroot du vhost)
#   │   ├── .env         ← lien vers shared/.env
#   │   └── config       ← lien vers shared/config
#   ├── wp-cli.yml       ← release
#   └── old_release/     ← copie de la release précédente (rollback)
#
# Secrets (Settings > Secrets and variables > Actions) :
#   OBLIGATOIRES   DEPLOY_HOST · DEPLOY_USER · DEPLOY_KEY
#   OPTIONNELS     DEPLOY_KEY_PASS (clé protégée par passphrase)
#                  DEPLOY_FINGERPRINT (vérification de l'hôte, anti-MITM)
# Un secret optionnel non défini vaut la chaîne vide et est simplement ignoré.
# Détail : readme/deploiement.md

name: Déploiement

on:
  workflow_call:
    inputs:
      environment:
        description: "Nom de l'environnement (affiché dans l'UI GitHub)"
        required: true
        type: string
      remote_path:
        # RELATIF au home de l'utilisateur SSH, sans `~/` : un `~` transmis par
        # une variable n'est PAS développé par le shell (`"$ROOT/x"` reste un
        # chemin littéral commençant par `~`), ce qui crée un dossier nommé « ~ »
        # au lieu de viser le home. Les scripts préfixent donc par $HOME.
        description: "Dossier de déploiement, relatif au home SSH (ex. preprod-lcds)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build de la release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      # Les plugins GRATUITS sont téléchargés ici (wpackagist), pas versionnés.
      # Les plugins payants vivent dans shared/plugins/ côté serveur.
      - name: Installer les dépendances PHP (sans dev)
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Installer Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: website/app/themes/lcds/package-lock.json

      # dist/ n'est pas versionné : sans ce build, le site part sans CSS ni JS.
      - name: Compiler le thème
        working-directory: website/app/themes/lcds
        run: |
          npm ci
          npm run build

      # node_modules ne sert qu'au build : il n'a rien à faire sur le serveur.
      - name: Assembler la release
        run: |
          rm -rf website/app/themes/lcds/node_modules
          mkdir -p release
          cp -a website config wp-cli.yml release/
          tar -czf release.tar.gz -C release .

      - name: Publier l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ inputs.environment }}
          path: release.tar.gz
          retention-days: 5

  deploy:
    name: Déploiement (${{ inputs.environment }})
    runs-on: ubuntu-latest
    needs: build
    environment: ${{ inputs.environment }}
    steps:
      - name: Récupérer l'artefact
        uses: actions/download-artifact@v4
        with:
          name: release-${{ inputs.environment }}

      - name: Déballer l'artefact
        run: |
          mkdir -p release
          tar -xzf release.tar.gz -C release

      # cp -a plutôt que mv : le site reste servi pendant la copie.
      - name: Sauvegarder la release en place
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          # Vides = ignorés. Renseigner DEPLOY_KEY_PASS si la clé est protégée
          # par une passphrase, et DEPLOY_FINGERPRINT pour vérifier l'identité
          # du serveur (anti-MITM) — voir readme/deploiement.md.
          passphrase: ${{ secrets.DEPLOY_KEY_PASS }}
          fingerprint: ${{ secrets.DEPLOY_FINGERPRINT }}
          port: 22
          script: |
            set -e
            ROOT="$HOME/${{ inputs.remote_path }}"
            mkdir -p "$ROOT/shared/plugins" "$ROOT/shared/uploads" \
                     "$ROOT/shared/uploads-webpc" "$ROOT/shared/cache"
            rm -rf "$ROOT/old_release"
            mkdir -p "$ROOT/old_release"
            for DIR in website config; do
              [ -d "$ROOT/$DIR" ] && cp -a "$ROOT/$DIR" "$ROOT/old_release/" || true
            done

      # --delete nettoie les fichiers supprimés du dépôt. Les exclusions
      # protègent l'état persistant : shared/, la sauvegarde, et les chemins qui
      # sont des liens vers shared/ (sinon rsync les remplacerait par des dossiers
      # vides à chaque déploiement).
      - name: Envoyer la release (rsync)
        uses: burnett01/rsync-deployments@v9
        with:
          switches: >-
            -avzr --delete
            --exclude=shared
            --exclude=old_release
            --exclude=website/.env
            --exclude=website/app/uploads
            --exclude=website/app/uploads-webpc
            --exclude=website/app/cache
            --exclude=website/.htpasswd
            --exclude=website/config
          path: ./release/
          remote_path: ${{ inputs.remote_path }}
          remote_host: ${{ secrets.DEPLOY_HOST }}
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_key: ${{ secrets.DEPLOY_KEY }}
          remote_key_pass: ${{ secrets.DEPLOY_KEY_PASS }}
          # rsync ne sait pas exploiter DEPLOY_FINGERPRINT : sa vérification
          # d'hôte s'appuie sur un known_hosts. À passer à "true" seulement après
          # avoir vérifié que l'hôte est connu, sinon le déploiement échoue.
          # strict_hostkeys_checking: "true"

      # Recréés à CHAQUE déploiement : rsync --delete emporte les liens des
      # plugins payants, qui ne font pas partie de la release.
      - name: Recréer les liens vers shared/
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          # Vides = ignorés. Renseigner DEPLOY_KEY_PASS si la clé est protégée
          # par une passphrase, et DEPLOY_FINGERPRINT pour vérifier l'identité
          # du serveur (anti-MITM) — voir readme/deploiement.md.
          passphrase: ${{ secrets.DEPLOY_KEY_PASS }}
          fingerprint: ${{ secrets.DEPLOY_FINGERPRINT }}
          port: 22
          script: |
            set -e
            ROOT="$HOME/${{ inputs.remote_path }}"

            # Remplace la destination par un lien. Le rm préalable traite le cas
            # où rsync a laissé un VRAI dossier à cet emplacement : `ln -nsf`
            # créerait alors le lien À L'INTÉRIEUR du dossier au lieu de le
            # remplacer. `-n` ne couvre que le cas d'un lien déjà existant.
            link_shared() {
              [ -L "$2" ] || rm -rf "$2"
              ln -nsf "$1" "$2"
            }

            # .env dans le docroot, à côté de wp-config.php : c'est là que la
            # configuration le cherche. Il n'est PAS servi par Apache — le bloc
            # FilesMatch de website/.htaccess refuse tous les .env.
            link_shared "$ROOT/shared/.env"          "$ROOT/website/.env"
            link_shared "$ROOT/shared/uploads"       "$ROOT/website/app/uploads"
            link_shared "$ROOT/shared/uploads-webpc" "$ROOT/website/app/uploads-webpc"
            link_shared "$ROOT/shared/cache"         "$ROOT/website/app/cache"

            # config/ : wp-config.php charge website/config/application.php, lié
            # vers shared/config. Le config/ livré par rsync sert de RÉFÉRENCE —
            # il amorce shared/config sur un nouvel environnement, et toute
            # divergence est signalée ici. Même contrat que .htaccess.
            if [ ! -d "$ROOT/shared/config" ]; then
              cp -a "$ROOT/config" "$ROOT/shared/config"
              echo "shared/config initialisé depuis le config/ versionné."
            elif ! diff -qr "$ROOT/config" "$ROOT/shared/config" >/dev/null 2>&1; then
              echo "!!! ATTENTION : shared/config diverge du config/ versionné."
              echo "!!! Le site charge shared/config. Reporter les changements à la main."
              diff -ur "$ROOT/shared/config" "$ROOT/config" || true
            fi
            link_shared "$ROOT/shared/config" "$ROOT/website/config"

            # .htaccess : c'est shared/ qui est SERVI, pour que chaque
            # environnement puisse ajouter ses propres directives (protection par
            # mot de passe en préprod). Le fichier versionné, livré par rsync,
            # sert de RÉFÉRENCE : il amorce shared/ au premier déploiement, et
            # toute divergence ultérieure est signalée dans ce log — sinon une
            # modification des en-têtes de sécurité committée dans le dépôt
            # n'atteindrait jamais le serveur, en silence.
            if [ ! -f "$ROOT/shared/.htaccess" ]; then
              cp "$ROOT/website/.htaccess" "$ROOT/shared/.htaccess"
              echo "shared/.htaccess initialisé depuis le fichier versionné."
            elif ! diff -q "$ROOT/website/.htaccess" "$ROOT/shared/.htaccess" >/dev/null 2>&1; then
              echo "!!! ATTENTION : shared/.htaccess diverge du fichier versionné."
              echo "!!! Le serveur applique shared/.htaccess. Reporter les changements à la main."
              diff -u "$ROOT/shared/.htaccess" "$ROOT/website/.htaccess" || true
            fi
            rm -f "$ROOT/website/.htaccess"
            ln -nsf "$ROOT/shared/.htaccess" "$ROOT/website/.htaccess"

            # .htpasswd : présent uniquement là où l'accès est restreint. Le lien
            # n'est créé que si le fichier existe, sinon Apache renverrait une 500
            # sur un AuthUserFile pointant dans le vide.
            if [ -f "$ROOT/shared/.htpasswd" ]; then
              ln -nsf "$ROOT/shared/.htpasswd" "$ROOT/website/.htpasswd"
              echo "shared/.htpasswd lié : accès restreint actif."
            else
              rm -f "$ROOT/website/.htpasswd"
              echo "Pas de shared/.htpasswd : accès libre sur cet environnement."
            fi

            # Plugins sous licence : une boucle, pour qu'ajouter un plugin dans
            # shared/plugins/ ne demande pas de toucher à ce workflow.
            for PLUGIN in "$ROOT"/shared/plugins/*/; do
              [ -d "$PLUGIN" ] || continue
              link_shared "${PLUGIN%/}" "$ROOT/website/app/plugins/$(basename "$PLUGIN")"
              echo "plugin partagé lié : $(basename "$PLUGIN")"
            done

      # Étapes post-déploiement, tolérantes à l'absence de WP-CLI sur le serveur.
      - name: Purger les caches
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          # Vides = ignorés. Renseigner DEPLOY_KEY_PASS si la clé est protégée
          # par une passphrase, et DEPLOY_FINGERPRINT pour vérifier l'identité
          # du serveur (anti-MITM) — voir readme/deploiement.md.
          passphrase: ${{ secrets.DEPLOY_KEY_PASS }}
          fingerprint: ${{ secrets.DEPLOY_FINGERPRINT }}
          port: 22
          script: |
            ROOT="$HOME/${{ inputs.remote_path }}"
            cd "$ROOT"
            if command -v wp >/dev/null 2>&1; then
              wp cache flush || true
              wp rewrite flush || true
              wp eval 'if (function_exists("wp_cache_clear_cache")) { wp_cache_clear_cache(); }' || true
            else
              echo "WP-CLI absent du serveur : purge des caches à faire à la main."
            fi
            # ⚠️ L'OPcache n'est vidé que par un rechargement de PHP-FPM. À
            # décommenter avec la commande de l'hébergeur, sinon l'ancien code
            # continue de tourner après le déploiement.
            # sudo systemctl reload php8.4-fpm
