# Déploiement — workflow réutilisable, appelé par deploy-preprod.yml et
# deploy-prod.yml (qui ne portent que le déclencheur et le chemin distant).
#
# Modèle repris de ~/Sites/code-cookie : build d'un artefact, sauvegarde de la
# release en place, rsync, puis recréation des liens vers shared/.
#
# Arborescence cible sur le serveur :
#
#   $HOME/<remote_path>/
#   ├── shared/          ← JAMAIS écrasé : .env, plugins payants, médias, cache
#   │   ├── .env
#   │   ├── .htaccess    ← SERVI par Apache (le fichier versionné l'amorce)
#   │   ├── .htpasswd    ← optionnel : protection par mot de passe (préprod)
#   │   ├── plugins/     ← plugins sous licence (ACF Pro…)
#   │   ├── uploads/
#   │   └── cache/
#   ├── config/          ← release, au même niveau que website/ (comme en local)
#   ├── website/         ← release (docroot du vhost)
#   │   └── .env         ← lien vers shared/.env
#   ├── wp-cli.yml       ← release
#   └── old_release/     ← copie de la release précédente (rollback)
#
# Secrets (Settings > Secrets and variables > Actions) :
#   OBLIGATOIRES   DEPLOY_HOST · DEPLOY_USER · DEPLOY_KEY
#   OPTIONNELS     DEPLOY_KEY_PASS (clé protégée par passphrase)
#                  DEPLOY_FINGERPRINT (vérification de l'hôte, anti-MITM)
# Un secret optionnel non défini vaut la chaîne vide et est simplement ignoré.
# Détail : readme/deploiement.md

name: Déploiement

on:
  workflow_call:
    inputs:
      environment:
        description: "Nom de l'environnement (affiché dans l'UI GitHub)"
        required: true
        type: string
      remote_path:
        # RELATIF au home de l'utilisateur SSH, sans `~/` : un `~` transmis par
        # une variable n'est PAS développé par le shell (`"$ROOT/x"` reste un
        # chemin littéral commençant par `~`), ce qui crée un dossier nommé « ~ »
        # au lieu de viser le home. Les scripts préfixent donc par $HOME.
        description: "Dossier de déploiement, relatif au home SSH (ex. preprod-lcds)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build de la release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      # Les plugins GRATUITS sont téléchargés ici (wpackagist), pas versionnés.
      # Les plugins payants vivent dans shared/plugins/ côté serveur.
      - name: Installer les dépendances PHP (sans dev)
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Installer Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: website/app/themes/lcds/package-lock.json

      # dist/ n'est pas versionné : sans ce build, le site part sans CSS ni JS.
      - name: Compiler le thème
        working-directory: website/app/themes/lcds
        run: |
          npm ci
          npm run build

      # node_modules ne sert qu'au build : il n'a rien à faire sur le serveur.
      - name: Assembler la release
        run: |
          rm -rf website/app/themes/lcds/node_modules
          mkdir -p release
          # composer.json part avec l'artefact : le pied de page y lit la version
          # du site. Il vit hors du docroot, donc Apache ne le sert pas — et il
          # ne contient aucun secret, vérifié.
          cp -a website config wp-cli.yml composer.json release/
          tar -czf release.tar.gz -C release .

      - name: Publier l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ inputs.environment }}
          path: release.tar.gz
          retention-days: 5

  deploy:
    name: Déploiement (${{ inputs.environment }})
    runs-on: ubuntu-latest
    needs: build
    environment: ${{ inputs.environment }}
    steps:
      - name: Récupérer l'artefact
        uses: actions/download-artifact@v4
        with:
          name: release-${{ inputs.environment }}

      - name: Déballer l'artefact
        run: |
          mkdir -p release
          tar -xzf release.tar.gz -C release

      # cp -a plutôt que mv : le site reste servi pendant la copie.
      - name: Sauvegarder la release en place
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          # Vides = ignorés. Renseigner DEPLOY_KEY_PASS si la clé est protégée
          # par une passphrase, et DEPLOY_FINGERPRINT pour vérifier l'identité
          # du serveur (anti-MITM) — voir readme/deploiement.md.
          passphrase: ${{ secrets.DEPLOY_KEY_PASS }}
          fingerprint: ${{ secrets.DEPLOY_FINGERPRINT }}
          port: 22
          script: |
            set -e
            ROOT="$HOME/${{ inputs.remote_path }}"
            mkdir -p "$ROOT/shared/plugins" "$ROOT/shared/uploads" "$ROOT/shared/cache"
            rm -rf "$ROOT/old_release"
            mkdir -p "$ROOT/old_release"
            for DIR in website config; do
              [ -d "$ROOT/$DIR" ] && cp -a "$ROOT/$DIR" "$ROOT/old_release/" || true
            done

      # --delete nettoie les fichiers supprimés du dépôt. Les exclusions
      # protègent l'état persistant : shared/, la sauvegarde, et les chemins qui
      # sont des liens vers shared/ (sinon rsync les remplacerait par des dossiers
      # vides à chaque déploiement).
      #
      # Le `/` initial de chaque motif est OBLIGATOIRE : il ancre l'exclusion à la
      # racine du transfert. Sans lui, rsync exclut TOUT composant de chemin
      # portant ce nom, à n'importe quelle profondeur — `--exclude=shared` avait
      # ainsi supprimé wp-includes/blocks/navigation-link/shared/ du cœur
      # WordPress, rendant le site fatal.
      - name: Envoyer la release (rsync)
        uses: burnett01/rsync-deployments@v9
        with:
          switches: >-
            -avzr --delete
            --exclude=/shared
            --exclude=/old_release
            --exclude=/website/.env
            --exclude=/website/app/uploads
            --exclude=/website/app/cache
            --exclude=/website/.htpasswd
          path: ./release/
          remote_path: ${{ inputs.remote_path }}
          remote_host: ${{ secrets.DEPLOY_HOST }}
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_key: ${{ secrets.DEPLOY_KEY }}
          remote_key_pass: ${{ secrets.DEPLOY_KEY_PASS }}
          # rsync ne sait pas exploiter DEPLOY_FINGERPRINT : sa vérification
          # d'hôte s'appuie sur un known_hosts. À passer à "true" seulement après
          # avoir vérifié que l'hôte est connu, sinon le déploiement échoue.
          # strict_hostkeys_checking: "true"

      # Recréés à CHAQUE déploiement : rsync --delete emporte les liens des
      # plugins payants, qui ne font pas partie de la release.
      - name: Recréer les liens vers shared/
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          # Vides = ignorés. Renseigner DEPLOY_KEY_PASS si la clé est protégée
          # par une passphrase, et DEPLOY_FINGERPRINT pour vérifier l'identité
          # du serveur (anti-MITM) — voir readme/deploiement.md.
          passphrase: ${{ secrets.DEPLOY_KEY_PASS }}
          fingerprint: ${{ secrets.DEPLOY_FINGERPRINT }}
          port: 22
          script: |
            set -e
            ROOT="$HOME/${{ inputs.remote_path }}"

            # Remplace la destination par un lien. Le rm préalable traite le cas
            # où rsync a laissé un VRAI dossier à cet emplacement : `ln -nsf`
            # créerait alors le lien À L'INTÉRIEUR du dossier au lieu de le
            # remplacer. `-n` ne couvre que le cas d'un lien déjà existant.
            link_shared() {
              [ -L "$2" ] || rm -rf "$2"
              ln -nsf "$1" "$2"
            }

            # .env dans le docroot, à côté de wp-config.php : c'est là que la
            # configuration le cherche. Il n'est PAS servi par Apache — le bloc
            # FilesMatch de website/.htaccess refuse tous les .env.
            link_shared "$ROOT/shared/.env"    "$ROOT/website/.env"
            link_shared "$ROOT/shared/uploads" "$ROOT/website/app/uploads"
            link_shared "$ROOT/shared/cache"   "$ROOT/website/app/cache"

            # .htaccess : c'est shared/ qui est SERVI, pour que chaque
            # environnement puisse ajouter ses propres directives (protection par
            # mot de passe en préprod). Le fichier versionné, livré par rsync,
            # sert de RÉFÉRENCE : il amorce shared/ au premier déploiement, et
            # toute divergence ultérieure est signalée dans ce log — sinon une
            # modification des en-têtes de sécurité committée dans le dépôt
            # n'atteindrait jamais le serveur, en silence.
            if [ ! -f "$ROOT/shared/.htaccess" ]; then
              cp "$ROOT/website/.htaccess" "$ROOT/shared/.htaccess"
              echo "shared/.htaccess initialisé depuis le fichier versionné."
            elif ! diff -q "$ROOT/website/.htaccess" "$ROOT/shared/.htaccess" >/dev/null 2>&1; then
              echo "!!! ATTENTION : shared/.htaccess diverge du fichier versionné."
              echo "!!! Le serveur applique shared/.htaccess. Reporter les changements à la main."
              diff -u "$ROOT/shared/.htaccess" "$ROOT/website/.htaccess" || true
            fi
            rm -f "$ROOT/website/.htaccess"
            ln -nsf "$ROOT/shared/.htaccess" "$ROOT/website/.htaccess"

            # .htpasswd : présent uniquement là où l'accès est restreint. Le lien
            # n'est créé que si le fichier existe, sinon Apache renverrait une 500
            # sur un AuthUserFile pointant dans le vide.
            if [ -f "$ROOT/shared/.htpasswd" ]; then
              ln -nsf "$ROOT/shared/.htpasswd" "$ROOT/website/.htpasswd"
              echo "shared/.htpasswd lié : accès restreint actif."
            else
              rm -f "$ROOT/website/.htpasswd"
              echo "Pas de shared/.htpasswd : accès libre sur cet environnement."
            fi

            # Plugins sous licence : une boucle, pour qu'ajouter un plugin dans
            # shared/plugins/ ne demande pas de toucher à ce workflow.
            for PLUGIN in "$ROOT"/shared/plugins/*/; do
              [ -d "$PLUGIN" ] || continue
              link_shared "${PLUGIN%/}" "$ROOT/website/app/plugins/$(basename "$PLUGIN")"
              echo "plugin partagé lié : $(basename "$PLUGIN")"
            done

      # Étapes post-déploiement, tolérantes à l'absence de WP-CLI sur le serveur.
      - name: Amorcer la navigation et purger les caches
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          # Vides = ignorés. Renseigner DEPLOY_KEY_PASS si la clé est protégée
          # par une passphrase, et DEPLOY_FINGERPRINT pour vérifier l'identité
          # du serveur (anti-MITM) — voir readme/deploiement.md.
          passphrase: ${{ secrets.DEPLOY_KEY_PASS }}
          fingerprint: ${{ secrets.DEPLOY_FINGERPRINT }}
          port: 22
          script: |
            ROOT="$HOME/${{ inputs.remote_path }}"
            cd "$ROOT"

            # WP-CLI charge l'autoloader de Composer, qui EXIGE PHP >= 8.4 : le
            # `platform_check.php` produit à la construction refuse net en
            # dessous, et rien ne s'exécute.
            #
            # Or sur un mutualisé le PHP de la ligne de commande N'EST PAS celui
            # du web : le panneau de l'hébergeur ne règle que le second.
            # Constaté en préproduction IONOS le 06/09/2026 — web en 8.4, SSH en
            # 8.0.30 — exactement le piège annoncé dans readme/deploiement.md.
            #
            # `WP_CLI_PHP` ne servirait à rien ici : la documentation de WP-CLI
            # le donne « only works for non-Phar installation », or l'archive
            # phar est l'installation courante. On invoque donc le binaire
            # choisi AVEC le phar en argument.
            WP_BIN=$(command -v wp 2>/dev/null || true)
            PHP_BIN=""
            for candidat in php8.4 php8.4-cli php84 /usr/bin/php8.4 /usr/local/bin/php8.4 php; do
              chemin=$(command -v "$candidat" 2>/dev/null) || continue
              "$chemin" -r 'exit(PHP_VERSION_ID >= 80400 ? 0 : 1);' >/dev/null 2>&1 || continue
              PHP_BIN="$chemin"
              break
            done

            if [ -n "$WP_BIN" ] && [ -n "$PHP_BIN" ]; then
              # Vérifié plutôt que supposé : si `wp` était une enveloppe shell
              # et non un phar, le passer à PHP échouerait sans rien dire.
              if "$PHP_BIN" "$WP_BIN" --version >/dev/null 2>&1; then
                wp() { "$PHP_BIN" "$WP_BIN" "$@"; }
                echo "WP-CLI via $PHP_BIN ($("$PHP_BIN" -r 'echo PHP_VERSION;'))."
              else
                echo "WP-CLI ne s'exécute pas via $PHP_BIN : on garde le \`wp\` du serveur."
              fi
            fi

            if [ -z "$WP_BIN" ]; then
              echo "WP-CLI absent du serveur : amorçage de la navigation et purge des caches à faire à la main."
            elif [ -z "$PHP_BIN" ]; then
              # `::warning::` remonte dans le résumé du run : sans ça le message
              # se perd dans le log, et une purge sautée passe inaperçue —
              # toutes les commandes `wp` sont en `|| true`.
              echo "::warning::Aucun PHP >= 8.4 en ligne de commande sur le serveur (défaut : $(php -v 2>/dev/null | head -1)). Amorçage des menus et purges de cache NON exécutés."
            else
              # Les menus et leurs entrées par défaut. L'amorçage est accroché à
              # `admin_init` dans le thème : sans cet appel, le site n'aurait pas
              # de navigation avant la première visite d'un administrateur —
              # `wp_nav_menu()` est appelé avec `fallback_cb => false`.
              # Idempotent, et un menu déjà garni par un contributeur n'est
              # jamais retouché — voir readme/menus.md.
              wp eval 'lcds_seed_default_menus();' || true
              # Les traductions des plugins ne sont pas dans l'artefact : sans
              # elles, Yoast titre les 404 et la recherche en anglais sur un
              # site déclaré en fr. Le script qui suit rattrape les gabarits
              # déjà enregistrés en anglais, sans toucher à une valeur saisie
              # par un contributeur — voir readme/seo.md.
              wp language plugin install --all fr_FR || true
              wp eval 'lcds_reset_seo_titles();' || true
              wp cache flush || true
              wp rewrite flush || true
              wp eval 'if (function_exists("wp_cache_clear_cache")) { wp_cache_clear_cache(); }' || true
            fi
            # ⚠️ L'OPcache n'est vidé que par un rechargement de PHP-FPM. À
            # décommenter avec la commande de l'hébergeur, sinon l'ancien code
            # continue de tourner après le déploiement.
            # sudo systemctl reload php8.4-fpm

      # Seul composer.lock est nécessaire ici (voir l'étape suivante) : on évite
      # de cloner tout le dépôt pour un fichier.
      # ⚠️ actions/checkout nettoie le workspace : ces deux étapes doivent rester
      # les dernières du job, la release ayant déjà été envoyée par rsync.
      - name: Récupérer composer.lock
        uses: actions/checkout@v4
        with:
          sparse-checkout: composer.lock
          sparse-checkout-cone-mode: false

      # ---------------------------------------------------------------------
      # Veille des dépendances (Watcha) : envoie la liste des paquets déployés.
      # Guide complet (variables à créer, cas particuliers, refus) : /documentation
      # sur l'instance Watcha.
      #
      # ⚠️ WATCHA_TOKEN doit être défini au niveau de l'ENVIRONNEMENT, pas du
      # dépôt : un secret de dépôt s'applique à preprod ET à production, qui
      # écriraient alors dans le même site Watcha en s'écrasant mutuellement.
      - name: Signaler l'inventaire à Watcha
        # Le déploiement a réussi : une veille injoignable ne doit pas le marquer en échec.
        continue-on-error: true
        env:
          WATCHA_TOKEN: ${{ secrets.WATCHA_TOKEN }}
          WATCHA_URL: ${{ vars.WATCHA_URL || secrets.WATCHA_URL }}
        run: |
          # Guide d'installation : <WATCHA_URL>/documentation
          [ -n "$WATCHA_TOKEN" ] && [ -n "$WATCHA_URL" ] || { echo "Watcha non configuré : envoi ignoré."; exit 0; }
          [ -s composer.lock ] || { echo "composer.lock absent : rien à envoyer."; exit 0; }
          while [ "${WATCHA_URL%/}" != "$WATCHA_URL" ]; do WATCHA_URL="${WATCHA_URL%/}"; done

          body=$(mktemp); trace=$(mktemp)
          # --http1.1 et « Expect: » vidé : sans eux, un proxy peut faire perdre le corps.
          result=$(curl -sS --http1.1 -H "Expect:" -v -o "$body" -w '%{http_code} %{size_upload}' \
            -X POST "$WATCHA_URL/api/inventory" \
            -H "X-Watcha-Token: $WATCHA_TOKEN" \
            -F "lock=@composer.lock" 2>"$trace") || result="000 0"
          code=${result%% *}; sent=${result##* }   # expansion et non « set -- » : zsh diffère

          if [ "$code" = "200" ]; then cat "$body"; echo; exit 0; fi

          # Watcha explique lui-même chaque refus dans sa réponse : on n'ajoute ici que
          # ce qu'un serveur ne peut pas savoir.
          echo "Envoi de l'inventaire refusé (HTTP $code) :"
          head -c 500 "$body"; echo
          echo "→ composer.lock : $(wc -c < composer.lock) octets ; émis par curl : $sent."
          if [ "$code" = "000" ]; then
            echo "→ Aucune réponse : vérifiez WATCHA_URL et le réseau."
          elif head -c 200 "$body" | grep -qi '<html\|<!doctype'; then
            echo "→ Réponse HTML : le SERVEUR WEB a refusé, Watcha n'a rien vu."
          fi
          sed -E 's/(X-Watcha-Token:).*/\1 ***/I' "$trace" | grep -E '^[*<>]' \
            | grep -vE '^\* (TLSv|SSL|ALPN|Server certificate|  )' | head -30
