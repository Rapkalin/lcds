# CI — qualité, sécurité des dépendances, secrets et build front.
#
# Équivalent GitHub des jobs `php_quality`, `dependency_cve` et
# `secret_detection` du pipeline GitLab de référence. Les jobs de déploiement
# (Helm / Kube / registry interne) ne sont volontairement PAS repris : ils
# dépendent de templates GitLab privés. Voir readme/ci-cd.md.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Une nouvelle poussée sur une branche annule le run précédent encore en cours.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php-quality:
    name: Qualité PHP (Pint + PHPCS + PHPStan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      # composer.lock est committé → install déterministe.
      - name: Installer les dépendances
        run: composer install --no-interaction --no-progress --prefer-dist

      # Enchaîne Pint (style) + PHPCS/Slevomat (types natifs) + PHPStan (analyse).
      - name: composer check
        run: composer check

  php-tests:
    name: Tests (Pest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Installer les dépendances
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: composer test
        run: composer test

  dependency-cve:
    name: CVE des dépendances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      # Audite composer.lock contre la base d'avis de sécurité (Packagist /
      # GitHub). --locked : lit le lock sans installer vendor/ ;
      # --abandoned=ignore : un paquet abandonné (≠ vulnérable) ne fait pas
      # échouer le check.
      - name: composer audit
        run: composer audit --locked --no-interaction --abandoned=ignore

  secret-scan:
    name: Détection de secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Historique complet : gitleaks scanne aussi les commits passés, pas
          # seulement l'état courant de l'arbre.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-front:
    name: Build front (webpack)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website/app/themes/lcds
    steps:
      - uses: actions/checkout@v4

      - name: Installer Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: website/app/themes/lcds/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      # dist/ n'est pas versionné : ce job vérifie que le build passe toujours.
      # Il ne publie aucun artefact — la compilation reste faite au déploiement.
      - name: npm run build
        run: npm run build
